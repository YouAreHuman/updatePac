name: Auto Update Nodes

on:
  push:
    branches:
      - master
  # 1. 定时触发：每天从 00:00 UTC 开始，每 4 小时运行一次
  # 对应 UTC 时间: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00
  # 注意：GitHub Actions 使用 UTC 时间。如果你需要北京时间 (UTC+8)，请自行换算。
  # 下面是 UTC 时间的每4小时：
  schedule:
    - cron: '0 16,20,0,4,8,12 * * *'
  
  # 允许手动触发测试
  workflow_dispatch:

jobs:
  update-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 2. 下载当前仓库代码 (必须步骤，否则无法操作文件)
      - name: Checkout current repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 获取完整历史，方便对比（虽然这里主要看文件内容）

      # 3. 下载 GitHub 上另外一个 node 项目
      # 假设外部项目地址是 https://github.com/USER/REPO_NAME
      # 我们将其克隆到子目录 'cfw'
      - name: Clone external Node project
        run: |
          git clone --depth 1 https://github.com/lsq/cfw_config.git cfw

      # 4. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24 # 根据你的项目需求调整版本
          # cache: 'npm'
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      # 5. 安装 pnpm
      # - name: Install pnpm
        # uses: pnpm/action-setup@v4
        # with:
          # version: 10 # 或者使用 'latest'
          # cache: true

      # 6. 在外部项目中安装依赖
      - name: Install dependencies from cfw
        run: |
          cd cfw
          pnpm install --frozen-lockfile || pnpm install
          # sudo apt-get install yq
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq

      # 7. 执行上面写好的代码
      # 假设你的入口脚本在 cfw 的根目录，或者你需要指定路径
      # 这里假设你的脚本是 cfw/index.js 或者 cfw 下有 package.json script
      - name: Run update script
        id: run_script
        run: |
          chmod +x scripts/*.sh
          cd cfw
          # 方式 A: 如果 package.json 里有 "start": "node index.js"
          # pnpm start
          
          # 方式 B: 直接运行你的入口文件 (根据你之前的代码逻辑调整)
          # 假设你的主文件叫 index.js 或 update.js
          mkdir -p downloads
          node getPac.js
          
          # 检查生成的文件是否存在
          if [ ! -f "newpac.yaml" ]; then
            echo "❌ 错误: 脚本执行成功但未生成 newpac.yaml"
            exit 1
          fi
          echo "✅ 脚本执行完成，newpac.yaml 已生成"

          if [ ! -f "ssrhub.yaml" ]; then
            echo "❌ 错误: 脚本执行成功但未生成ssrhub.yaml"
            exit 1
          fi

          if [ ! -f ../ssrhub.yaml ];then
            cp ssrhub.yaml ../ssrhub.yaml
            echo "needCommit=1" >> $GITHUB_OUTPUT
          else
            if ../scripts/yaml_compare.sh ssrhub.yaml ../ssrhub.yaml; then
              echo "比对完成，文件内容相同..."
            else
              echo "needCommit=1" >> $GITHUB_OUTPUT
            fi
          fi

      # - name: Use output
      #   run: |
      #     echo "Result was ${{ steps.run_script.outputs.needCommit}}"
      # 8. 比较文件并自动 Push
      - name: Check changes and Push
        if: ${{ steps.run_script.outputs.needCommit == 1 }}
        run: |
          # 配置 Git 用户信息
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          ./scripts/gitcheck.sh newpac.yaml
          ./scripts/gitcheck.sh newpac.json
          ./scripts/gitcheck.sh ssrhub.yaml
          [ -e ready.txt ] && git push origin HEAD:master && echo "✅ 推送成功！"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
