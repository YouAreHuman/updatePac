# 地址: https://github.com/Wans-OS/my-backup
# 作者: Wans
# 更新: 2026-10-06 06:30:18
# 描述: 在proxy-providers加入您的机场订阅链接 (代理提供者)

# 订阅锚点，排除了一些节点，例如 包含剩余, 官网, 到期, 也可以在exclude-filter添加你需要排除的节点
FilterPP: &FilterPP "Expire|到期|剩余|Traffic|网址|官网|过期|地址"

# 测速地址
# YouTube
# http://www.youtube.com/generate_204
# Google
# http://www.gstatic.com/generate_204
# http://www.google.com/generate_204
# Cloudflare
# http://cp.cloudflare.com/generate_204
# http://www.qualcomm.cn/generate_204
UrlTest:  &UrlTest 'http://www.gstatic.com/generate_204'

PU: &PU { exclude-filter: *FilterPP, type: http, interval: 43200, health-check: { enable: true, url: *UrlTest, interval: 300 } }
PF: &PF { exclude-filter: *FilterPP, type: file, interval: 43200, health-check: { enable: true, url: *UrlTest, interval: 300 } }
# 官方配置文档: https://wiki.metacubex.one/config/proxy-providers/
proxy-providers:
  newpac:
    <<: *PU
    interval: 3600
    url: https://gh-proxy.com/raw.githubusercontent.com/YouAreHuman/updatePac/master/newpac.yaml
    path: proxy_providers/newpac_newpac.yaml
    override:
      upd: true
      additional-prefix: newpac|
      proxy-name:
        - pattern: 【(.*?)】|机场推荐[：:]
          target: ""
  xrayvip:
    <<: *PU
    interval: 3600
    url: https://www.xrayvip.com/free.txt
    path: proxy_providers/xrayvip_free.txt
    override:
      upd: true
      additional-prefix: xrayvip|
      proxy-name:
        - pattern: 【(.*?)】|机场推荐[：:]
          target: ""
  freeV2net:
    <<: *PU
    interval: 3600
    url: https://xmxosfepggzm.503403.xyz
    path: proxy_providers/freeV2net_xmxosfepggzm.503403.xyz
    override:
      upd: true
      additional-prefix: freeV2net|
      proxy-name:
        - pattern: 【(.*?)】|机场推荐[：:]
          target: ""
  ssrsub:
    <<: *PU
    interval: 3600
    url: https://gh-proxy.com/raw.githubusercontent.com/ssrsub/ssr/master/clash.yaml
    path: proxy_providers/ssrsub_clash.yaml
    override:
      upd: true
      additional-prefix: ssrsub|
      proxy-name:
        - pattern: 【(.*?)】|机场推荐[：:]
          target: ""
  fanpx:
    <<: *PU
    interval: 3600
    url: https://gh-proxy.com/raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta.yaml
    path: proxy_providers/fanpx_clash-meta.yaml
    override:
      upd: true
      additional-prefix: fanpx|
      proxy-name:
        - pattern: 【(.*?)】|机场推荐[：:]
          target: ""
  fanpx1:
    <<: *PU
    interval: 3600
    url: https://gh-proxy.com/raw.githubusercontent.com/snakem982/proxypool/main/source/clash-meta-2.yaml
    path: proxy_providers/fanpx_clash-meta-2.yaml
    override:
      upd: true
      additional-prefix: fanpx1|
      proxy-name:
        - pattern: 【(.*?)】|机场推荐[：:]
          target: ""
  anaer:
    <<: *PU
    interval: 3600
    url: https://gh-proxy.com/raw.githubusercontent.com/anaer/Sub/main/proxies.yaml
    path: proxy_providers/anaer_proxies.yaml
    override:
      upd: true
      additional-prefix: anaer|
      proxy-name:
        - pattern: 【(.*?)】|机场推荐[：:]
          target: ""

# 通用配置
mode: rule
ipv6: false
mixed-port: 7890
allow-lan: true
bind-address: '*'
log-level: warning
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-interval: 15
keep-alive-idle: 600
etag-support: true

# 入站
tun:
  enable: true
  stack: mips
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53

# 规则选择缓存
profile:
  store-selected: true
  store-fake-ip: true
  tracing: true

# DNS配置
dns:
  enable: true
  ipv6: false
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::/64
  fake-ip-filter-mode: blacklist
  fake-ip-ttl: 1
  fake-ip-filter:
    - RULE-SET:Lan
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: false
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  direct-nameserver:
    - system
  direct-nameserver-follow-policy: true
  default-nameserver:
    - tls://223.5.5.5
    - tls://119.29.29.29
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    "RULE-SET:China":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.qinyues4.cc":
      - https://dns.alidns.com/dns-query
    "+.fastgit.cc":
      - https://dns.alidns.com/dns-query#ecs=223.5.5.5/24&ecs-override=true
      - https://doh.pub/dns-query#ecs=223.5.5.5/24&ecs-override=true
    "+.gh-proxy.com":
      - https://dns.alidns.com/dns-query#ecs=223.5.5.5/24&ecs-override=true
      - https://doh.pub/dns-query#ecs=223.5.5.5/24&ecs-override=true
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver-policy: null
geodata-mode: false
geo-auto-update: false
geo-update-interval: 24
geodata-loader: memconservative
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

# 嗅探
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports: [ 443, 8443 ]
    HTTP:
      ports: [ 80, 8080-8880 ]
      override-destination: true
    QUIC:
      ports: [ 443, 8443 ]
  skip-domain:
     - "Mijia Cloud"
     - "+.push.apple.com"

# 实验性功能
experimental:
  quic-go-disable-gso: true
  sniff-tls-sni: true

# 面板设置
external-ui-name: zashboard
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
secret: Wans
external-controller: '0.0.0.0:9090'

